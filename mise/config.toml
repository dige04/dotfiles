# Machine setup for Hieu's Macs, applied with `mise bootstrap`.
#
# ~/.config/mise/config.toml is a symlink to this file. Per-machine values
# (git identity) live in ~/.config/mise/config.local.toml, which setup.sh
# writes and which is never committed.
#
# One tool per job: CLIs and runtimes go in [tools]; Homebrew is only for
# libraries, services and things mise has no backend for; apps are casks.

[settings]
experimental = true
legacy_version_file_disable_tools = ['java']
idiomatic_version_file_enable_tools = ["node"]

[settings.npm]
package_manager = "pnpm"

[settings.pipx]
uvx = true

[settings.cargo]
binstall = true

[settings.github]
# Avoids GitHub API rate limits once `gh auth login` has run; harmless before.
credential_command = "gh auth token"

# =============================================================================
# Tools (mise install)
# =============================================================================
[tools]
# Runtimes
go = "1.25.1"
node = "latest"
python = "3.11"
rust = "latest"
zig = "0.11.0"
bun = "latest"
pnpm = "latest"
uv = "latest"

# Shell and everyday CLIs
starship = "latest"
zoxide = "latest"
fzf = "latest"
fd = "latest"
bat = "latest"
ripgrep = "latest"
ast-grep = "latest"
jq = "latest"
yq = "latest"
dasel = "latest"
jnv = "latest"
direnv = "latest"
neovim = "0.11.4"
lazygit = "latest"
delta = "latest"
"forgejo:mergiraf/mergiraf" = "latest"
gh = "latest"
git-lfs = "latest"
shellcheck = "latest"
shfmt = "latest"
usage = "latest"
doggo = "latest"
hurl = "latest"
k6 = "latest"
yt-dlp = "latest"
pandoc = "latest"
typst = "latest"
rclone = "latest"
gitleaks = "latest"
actionlint = "latest"

# Cloud and infra
cloudflared = "latest"
kubectl = "latest"
k9s = "latest"
terraform = "latest"
doctl = "latest"

# AI agents and their helpers
claude = "latest"
codex = "latest"
opencode = "latest"
pi = "latest"
gemini-cli = "latest"
"npm:@kaitranntt/ccs" = "latest"
"npm:ccusage" = "latest"
"npm:mcp-chrome-bridge" = "latest"
"github:router-for-me/CLIProxyAPI" = { version = "latest", exe = "cli-proxy-api" }
"github:asyrjasalo/dynamic-mcp" = "latest"
"github:memextech/ht-mcp" = "latest"

# Security
"github:bettercap/bettercap" = "latest"

# =============================================================================
# Dotfiles: links from ~ into ~/.dotfiles
# =============================================================================
[dotfiles]
"~/.config/mise/config.toml" = { source = "~/.dotfiles/mise/config.toml", mode = "symlink" }

"~/.zshrc" = { source = "~/.dotfiles/home/.zshrc", mode = "symlink" }
"~/.zprofile" = { source = "~/.dotfiles/home/.zprofile", mode = "symlink" }
"~/.profile" = { source = "~/.dotfiles/home/.profile", mode = "symlink" }
"~/.tmux.conf" = { source = "~/.dotfiles/home/.tmux.conf", mode = "symlink" }
"~/.base.gitconfig" = { source = "~/.dotfiles/home/.base.gitconfig", mode = "symlink" }
"~/.gitattributes" = { source = "~/.dotfiles/home/.gitattributes", mode = "symlink" }
"~/.config/git/ignore" = { source = "~/.dotfiles/home/.config/git/ignore", mode = "symlink" }
"~/.config/herdr/config.toml" = { source = "~/.dotfiles/home/.config/herdr/config.toml", mode = "symlink" }
# Karabiner replaces karabiner.json when it saves, which would break a file
# link, so the whole directory is linked (Karabiner's own recommendation).
"~/.config/karabiner" = { source = "~/.dotfiles/home/.config/karabiner", mode = "symlink" }

# ~/.gitconfig is also written by `git config --global` and `gh auth
# setup-git`, so only these two blocks are managed.
"~/.gitconfig/identity" = { source = "~/.dotfiles/mise/snippets/git-identity.tera", template = "tera" }
"~/.gitconfig/base" = { block = "[include]\n\tpath = ~/.base.gitconfig" }

# =============================================================================
# Homebrew formulae and casks. mise installs them into /opt/homebrew itself;
# Homebrew does not need to be installed.
# =============================================================================
[bootstrap.brew]
# Take over an app already in /Applications instead of reinstalling it, which
# keeps its macOS privacy permissions.
adopt = true

[bootstrap.packages]
