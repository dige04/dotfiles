# =============================================================================
# Git repositories
# =============================================================================
[bootstrap.repos]
"~/.tmux/plugins/tpm" = { url = "https://github.com/tmux-plugins/tpm" }

# =============================================================================
# macOS preferences, copied from the MacBook
# =============================================================================
[bootstrap.macos.dock]
autohide = false
orientation = "left"
tilesize = 33
magnification = false

[bootstrap.macos.finder]
show_pathbar = true
show_status_bar = false
preferred_view_style = "list"

[bootstrap.macos.trackpad]
tap_to_click = true
three_finger_drag = false

[bootstrap.macos.defaults]
"com.apple.screencapture" = { location = "~/Pictures/Screenshots" }

# =============================================================================
# Hooks: each one is safe to run again
# =============================================================================
[bootstrap.hooks]
pre-packages = "bash $HOME/.dotfiles/mise/scripts/prepare-host.sh"
post-defaults = "killall Dock Finder SystemUIServer 2>/dev/null || true"

# =============================================================================
# Day-to-day tasks: `mise run dot:<name>` from any directory
# =============================================================================
[tasks."dot:cd"]
description = "Open a shell in ~/.dotfiles; exit returns to where you were"
dir = "{{env.HOME}}/.dotfiles"
raw = true
run = "exec ${SHELL:-zsh}"

[tasks."dot:status"]
description = "Show dotfiles not yet applied and uncommitted changes in ~/.dotfiles"
run = ["mise dot status", "git -C $HOME/.dotfiles status --short"]

[tasks."dot:save"]
description = "Commit every change in ~/.dotfiles and push it"
run = "bash $HOME/.dotfiles/mise/scripts/dot-save.sh"

[tasks."dot:update"]
description = "Pull the latest dotfiles, then link, install and apply anything new"
run = [
  "git -C $HOME/.dotfiles pull --rebase --autostash",
  "mise bootstrap --yes",
]

[tasks."dot:up"]
description = "Upgrade mise itself, every mise tool and every brew package"
run = [
  "mise self-update --yes",
  "mise up",
  "mise bootstrap packages upgrade --yes",
]
